<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณค่าเช่า - หอพักตองหนึ่ง</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Prompt', sans-serif;
            
            /* 🌟 ภาพพื้นหลังห้องพักสไตล์โมเดิร์นคลีนๆ */
            background-image: url('https://images.unsplash.com/photo-1499916078039-922301b0eb9b?q=80&w=2560&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            color: #f5f5f7; 
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
        }

        .container {
            max-width: 1200px; /* ขยายความกว้างนิดหน่อยรองรับคอลัมน์ค่าห้อง */
            width: 100%;
            
            /* 🌟 สไตล์ Premium Dark Glass */
            background: linear-gradient(135deg, rgba(30, 30, 35, 0.8) 0%, rgba(15, 15, 20, 0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
            
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        #dynamic-toast {
            position: fixed;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 20, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        #dynamic-toast.show { top: 25px; }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            color: #fff;
        }
        .header h1 { margin: 0 0 5px 0; font-size: 26px; font-weight: 600; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .header p { margin: 0; font-size: 15px; color: #ccc; }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .form-section {
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 13px; font-weight: 500; color: #ddd; }
        
        .form-section input, .form-section select {
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Prompt', sans-serif;
            transition: all 0.3s;
            cursor: pointer;
        }
        .form-section input:focus, .form-section select:focus {
            border-color: transparent;
            border-bottom: 1px solid #00f2fe; 
            outline: none;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3), 0 5px 15px rgba(0, 242, 254, 0.15);
        }
        
        input[type="month"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.7;
        }

        .btn-group { display: flex; gap: 10px; }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            transition: all 0.3s;
            flex: 1;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        #saveBtn {
            background: linear-gradient(135deg, #0a84ff 0%, #0056b3 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3);
        }
        #saveBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(10, 132, 255, 0.5); }
        #cancelBtn { background: rgba(255,255,255,0.1); color: #fff; display: none; }
        #cancelBtn:hover { background: rgba(255,255,255,0.2); }

        .table-container {
            overflow-x: auto;
            padding: 15px;
        }
        table { width: 100%; border-collapse: collapse; text-align: center; color: #f5f5f7; }
        th, td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        th { 
            color: #ccc; 
            font-weight: 500; 
            padding: 15px; 
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        td { padding: 15px; vertical-align: middle; }
        tr:hover td { background-color: rgba(255, 255, 255, 0.03); }
        tr:last-child td { border-bottom: none; }

        .month-highlight { font-weight: 600; color: #4dabf7; text-shadow: 0 0 10px rgba(77, 171, 247, 0.4); }

        .status-badge { padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; display: inline-block; backdrop-filter: blur(5px); }
        .status-paid { background-color: rgba(40, 167, 69, 0.2); color: #51cf66; border: 1px solid rgba(81, 207, 102, 0.3); }
        .status-unpaid { background-color: rgba(255, 193, 7, 0.2); color: #ffd43b; border: 1px solid rgba(255, 212, 59, 0.3); }

        .action-btns { display: flex; gap: 8px; justify-content: center; }
        .btn-icon { 
            padding: 8px 15px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 500; 
            flex: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-edit { color: #74c0fc; }
        .btn-edit:hover { background-color: rgba(13, 110, 253, 0.2); border-color: #74c0fc; }
        .btn-delete { color: #ff6b6b; }
        .btn-delete:hover { background-color: rgba(220, 53, 69, 0.2); border-color: #ff6b6b; }

        .footer-info {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            color: #bbb;
            font-size: 14px;
            padding: 15px 20px;
        }
    </style>
</head>
<body>

<div id="dynamic-toast">แจ้งเตือน</div>

<div class="container">
    <div class="header glass-panel">
        <h1>⚡ ระบบคำนวณค่าเช่า หอพักตองหนึ่ง</h1>
        <p>เลขที่ 111 หมู่ที่ 1 ต.เกาะแก้ว อ.เสลภูมิ จ.ร้อยเอ็ด</p>
    </div>

    <div class="dashboard-layout">
        <div class="form-section glass-panel">
            <div class="input-group">
                <label>📅 เดือน / ปี</label>
                <input type="month" id="monthYear" required>
            </div>
            <div class="input-group">
                <label>⏮️ มิเตอร์ครั้งก่อน</label>
                <input type="number" id="prevMeter" placeholder="ระบุตัวเลข" required>
            </div>
            <div class="input-group">
                <label>⏭️ มิเตอร์ครั้งนี้</label>
                <input type="number" id="currMeter" placeholder="(ระบุตัวเลข)">
            </div>
            <div class="input-group">
                <label>🏠 ค่าห้อง (บาท)</label>
                <input type="number" id="roomRent" value="2000">
            </div>
            <div class="input-group">
                <label>💧 ค่าน้ำ (บาท)</label>
                <input type="number" id="waterBill" value="50">
            </div>
            <div class="input-group">
                <label>📌 สถานะ</label>
                <select id="status">
                    <option value="ยังไม่ชำระ">ยังไม่ชำระ</option>
                    <option value="ชำระแล้ว">ชำระแล้ว</option>
                </select>
            </div>
            <div class="btn-group">
                <button id="saveBtn" onclick="saveData()">💾 บันทึก</button>
                <button id="cancelBtn" onclick="cancelEdit()">❌ ยกเลิก</button>
            </div>
        </div>

        <div class="table-container glass-panel">
            <table>
                <thead>
                    <tr>
                        <th>เดือน / ปี</th>
                        <th>ครั้งก่อน</th>
                        <th>ครั้งนี้</th>
                        <th>หน่วยที่ใช้</th>
                        <th>ค่าไฟ (฿)</th>
                        <th>ค่าห้อง (฿)</th>
                        <th>ค่าน้ำ (฿)</th>
                        <th>รวมยอด (฿)</th>
                        <th>สถานะ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer-info glass-panel">
        <span>💡 ค่าไฟหน่วยละ 8 บาท • รวมค่าเช่าในระบบอัตโนมัติแล้ว</span>
    </div>
</div>

<script>
    const RATE_PER_UNIT = 8;
    let editIndex = -1; 
    
    // เปลี่ยนชื่อ Key เพื่อไม่ให้ข้อมูลซ้ำกับหน้าเว็บแรก
    const STORAGE_KEY = 'dormData_v2'; 
    
    const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

    window.onload = function() {
        renderTable();
        autoSetNextMonth(); 
    };

    function showToast(message) {
        const toast = document.getElementById('dynamic-toast');
        toast.innerText = message;
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    function formatToThaiMonthYear(yyyyMm) {
        if (!yyyyMm) return "";
        const parts = yyyyMm.split('-');
        const year = parseInt(parts[0]);
        const month = parseInt(parts[1]);
        const thaiYearStr = (year + 543).toString().slice(-2);
        const thaiMonthStr = thaiMonths[month - 1];
        return `${thaiMonthStr} ${thaiYearStr}`;
    }

    function parseFromThaiMonthYear(thaiStr) {
        if (!thaiStr) return "";
        const parts = thaiStr.trim().split(' ');
        if (parts.length < 2) return "";
        const monthIdx = thaiMonths.indexOf(parts[0]);
        if (monthIdx === -1) return "";
        const monthNum = (monthIdx + 1).toString().padStart(2, '0');
        const adYear = parseInt(parts[1]) + 2500 - 543; 
        return `${adYear}-${monthNum}`;
    }

    function autoSetNextMonth() {
        if (editIndex !== -1) return; 

        let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        if (records.length > 0) {
            const lastRecord = records[records.length - 1];
            const parts = lastRecord.monthYear.trim().split(' ');
            
            if (parts.length >= 2) {
                const currentMonth = parts[0];
                let currentYear = parseInt(parts[1]);
                
                let monthIndex = thaiMonths.indexOf(currentMonth);
                if (monthIndex !== -1) {
                    monthIndex++; 
                    if (monthIndex > 11) { 
                        monthIndex = 0; 
                        currentYear++; 
                    }
                    const adYear = currentYear + 2500 - 543;
                    const monthNum = (monthIndex + 1).toString().padStart(2, '0');
                    document.getElementById('monthYear').value = `${adYear}-${monthNum}`;
                    return;
                }
            }
        } else {
            const now = new Date();
            const currentMonth = (now.getMonth() + 1).toString().padStart(2, '0');
            document.getElementById('monthYear').value = `${now.getFullYear()}-${currentMonth}`;
        }
    }

    function saveData() {
        const rawMonthYear = document.getElementById('monthYear').value;
        const prevMeterInput = document.getElementById('prevMeter').value;
        const currMeterInput = document.getElementById('currMeter').value;
        const roomRent = parseInt(document.getElementById('roomRent').value) || 2000;
        const waterBill = parseInt(document.getElementById('waterBill').value) || 50;
        const status = document.getElementById('status').value;

        if (!rawMonthYear || prevMeterInput === '') {
            showToast('⚠️ กรุณาเลือกเดือน/ปี และกรอกมิเตอร์ครั้งก่อนด้วยครับ');
            return;
        }

        const prevMeter = parseInt(prevMeterInput);
        const currMeter = currMeterInput === '' ? prevMeter : parseInt(currMeterInput);

        if (currMeter < prevMeter) {
            showToast('⚠️ เลขมิเตอร์ครั้งนี้ต้องไม่น้อยกว่าครั้งก่อนครับ');
            return;
        }

        const unitsUsed = currMeter - prevMeter;
        const elecBill = unitsUsed * RATE_PER_UNIT;
        
        // คำนวณยอดรวม: ค่าไฟ + ค่าห้อง + ค่าน้ำ
        const total = elecBill + roomRent + waterBill;
        
        const monthYear = formatToThaiMonthYear(rawMonthYear);

        const record = {
            monthYear, prevMeter, currMeter: currMeterInput === '' ? '' : currMeter, 
            unitsUsed, elecBill, roomRent, waterBill, total, status
        };

        let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        if (editIndex === -1) {
            records.push(record);
            showToast('✨ บันทึกข้อมูลเรียบร้อยแล้ว');
        } else {
            records[editIndex] = record;
            editIndex = -1;
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = '💾 บันทึก';
            saveBtn.style.background = 'linear-gradient(135deg, #0a84ff 0%, #0056b3 100%)';
            document.getElementById('cancelBtn').style.display = 'none';
            showToast('🔄 อัปเดตข้อมูลสำเร็จ');
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        
        document.getElementById('currMeter').value = '';
        document.getElementById('prevMeter').value = currMeterInput !== '' ? currMeter : prevMeter; 

        renderTable();
        autoSetNextMonth(); 
    }

    function editData(index) {
        let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        const record = records[index];
        
        document.getElementById('monthYear').value = parseFromThaiMonthYear(record.monthYear);
        document.getElementById('prevMeter').value = record.prevMeter;
        document.getElementById('currMeter').value = record.currMeter;
        
        // ถ้าข้อมูลเก่าไม่มีค่าห้อง ให้ใส่ 2000 เป็นค่าตั้งต้น
        document.getElementById('roomRent').value = record.roomRent !== undefined ? record.roomRent : 2000;
        document.getElementById('waterBill').value = record.waterBill;
        document.getElementById('status').value = record.status;

        editIndex = index;
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerHTML = '🔄 อัปเดต';
        saveBtn.style.background = 'linear-gradient(135deg, #00f2fe 0%, #4facfe 100%)'; 
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editIndex = -1;
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerHTML = '💾 บันทึก';
        saveBtn.style.background = 'linear-gradient(135deg, #0a84ff 0%, #0056b3 100%)';
        document.getElementById('cancelBtn').style.display = 'none';
        
        document.getElementById('currMeter').value = '';
        autoSetNextMonth(); 
    }

    function deleteData(index) {
        if(confirm('ยืนยันที่จะลบข้อมูลเดือนนี้ใช่มั้ยครับ?')) {
            let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            records.splice(index, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            
            if (editIndex === index) cancelEdit();
            
            showToast('🗑️ ลบข้อมูลเรียบร้อย');
            renderTable();
            autoSetNextMonth(); 
        }
    }

    function renderTable() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = ''; 

        let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        records.forEach((record, index) => {
            const statusClass = record.status === 'ชำระแล้ว' ? 'status-paid' : 'status-unpaid';
            
            const displayPrevMeter = record.prevMeter;
            const displayCurrMeter = record.currMeter === '' ? '<span style="color:#666;">-</span>' : record.currMeter;
            const displayUnits = record.currMeter === '' ? '<span style="color:#666;">-</span>' : record.unitsUsed;
            
            const displayElecBill = record.currMeter === '' ? '<span style="color:#666;">-</span>' : record.elecBill.toLocaleString();
            
            // ดึงค่าห้องมาแสดงผล ถ้าเป็นบิลเก่าที่ยังไม่เคยมีคอลัมน์นี้ให้ default 2000
            const roomRent = record.roomRent !== undefined ? record.roomRent : 2000;
            const displayRoomRent = roomRent.toLocaleString();
            
            const displayWaterBill = record.waterBill.toLocaleString();
            
            let displayTotal = record.currMeter === '' ? (roomRent + record.waterBill) : record.total;
            displayTotal = displayTotal.toLocaleString();

            const row = `
                <tr>
                    <td class="month-highlight">${record.monthYear}</td>
                    <td>${displayPrevMeter}</td>
                    <td>${displayCurrMeter}</td>
                    <td>${displayUnits}</td>
                    <td>${displayElecBill}</td>
                    <td>${displayRoomRent}</td>
                    <td>${displayWaterBill}</td>
                    <td style="font-weight: 700; color: #00f2fe; font-size: 16px; text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);">${displayTotal}</td>
                    <td><span class="status-badge ${statusClass}">${record.status}</span></td>
                    <td class="action-btns">
                        <button class="btn-icon btn-edit" onclick="editData(${index})">✏️ แก้ไข</button>
                        <button class="btn-icon btn-delete" onclick="deleteData(${index})">🗑️ ลบ</button>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }
</script>

</body>
</html>
